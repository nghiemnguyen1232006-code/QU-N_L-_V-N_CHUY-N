<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:Segoe UI}
#map{height:100vh}
</style>
</head>

<body>

<div id="map"></div>

<script>

// 📍 tạo map
let map = L.map('map').setView([13.7765, 109.2237], 13);

// 🌍 layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

// 🚚 dữ liệu tài xế
let drivers = [
{ name:"Nam", lat:13.7765, lng:109.2237 },
{ name:"Tuấn", lat:13.78, lng:109.21 },
{ name:"Tài", lat:13.77, lng:109.22 }
];

// 📌 tạo marker
let markers = [];

drivers.forEach(d=>{
let m = L.marker([d.lat, d.lng])
.addTo(map)
.bindPopup("🚚 " + d.name);
markers.push({marker:m, data:d});
});

// 🔄 REALTIME (di chuyển giả lập)
setInterval(()=>{
markers.forEach(m=>{
// random di chuyển nhỏ
m.data.lat += (Math.random()-0.5) * 0.002;
m.data.lng += (Math.random()-0.5) * 0.002;

// cập nhật vị trí
m.marker.setLatLng([m.data.lat, m.data.lng]);
});
}, 2000);

</script>

</body>
</html>
