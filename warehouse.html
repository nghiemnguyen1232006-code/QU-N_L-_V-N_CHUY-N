<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#1f4fa3;color:white}
</style>
</head>

<body>

<h2>Kho</h2>

<table>
<thead>
<tr>
<th>Mã đơn</th><th>Ngày nhập</th><th>Ngày xuất</th><th>Trạng thái</th>
</tr>
</thead>

<tbody id="data"></tbody>
</table>

<script>
fetch("../api/warehouse.php")
.then(r=>r.json())
.then(data=>{
let html="";
data.forEach(w=>{
html+=`
<tr>
<td>${w.order_code}</td>
<td>${w.in_date}</td>
<td>${w.out_date}</td>
<td>${w.status}</td>
</tr>`;
});
document.getElementById("data").innerHTML=html;
});
</script>

</body>
</html>
