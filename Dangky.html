<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng ký FASTGO</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(to bottom, #d1d8e4, #1f4fa3);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.register-box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 320px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
    animation: fadeUp 0.8s ease;
}

.logo {
    width: 200px;
}

h2 {
    margin: 10px 0 20px;
    color: #1d5ba1;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
    cursor: pointer;
}

.register-btn {
    background: #1f4fa3;
    color: white;
}

.back-btn {
    background: #e0e0e0;
}

.error {
    color: red;
    font-size: 14px;
}

@keyframes fadeUp {
    from {opacity: 0; transform: translateY(30px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="register-box">
    <img src="logo.png" class="logo">
    <h2>Đăng ký</h2>

    <input type="text" id="newUser" placeholder="Tên đăng nhập">
    <input type="password" id="newPass" placeholder="Mật khẩu">
    <input type="password" id="confirmPass" placeholder="Nhập lại mật khẩu">

    <div class="error" id="error"></div>

    <button class="register-btn" onclick="register()">Đăng ký</button>
    <button class="back-btn" onclick="goLogin()">Quay lại</button>
</div>

<script>
function register() {
    let user = document.getElementById("newUser").value;
    let pass = document.getElementById("newPass").value;
    let confirm = document.getElementById("confirmPass").value;

    if(user === "" || pass === "" || confirm === ""){
        document.getElementById("error").innerText = "Vui lòng nhập đầy đủ!";
        return;
    }

    if(pass !== confirm){
        document.getElementById("error").innerText = "Mật khẩu không khớp!";
        return;
    }

    let form = new FormData();
    form.append("user", user);
    form.append("pass", pass);

    fetch("api/register.php", {
        method: "POST",
        body: form
    })
    .then(res => res.json())
    .then(data => {
        if(data.status === "success"){
            alert("Đăng ký thành công!");
            window.location.href = "Dangnhap.html";
        } else {
            document.getElementById("error").innerText = "Tài khoản đã tồn tại!";
        }
    });
}
function goLogin() {
    window.location.href = "Dangnhap.html";
}
</script>

</body>
</html>
