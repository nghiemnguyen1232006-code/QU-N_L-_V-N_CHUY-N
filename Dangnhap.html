<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng nhập FASTGO</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(to bottom, #d1d8e4, #1f4fa3);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Box login */
.login-box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 320px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
}

/* Logo */
.logo {
    width: 250px;
    margin-bottom: 1.5px;
}

/* Title */
h2 {
    margin: 10px 0 20px;
    color: #1d5ba1;
}

/* Input */
input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* Button login */
.login-btn {
    width: 100%;
    padding: 12px;
    background: #1f4fa3;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 10px;
    cursor: pointer;
}

/* Button register */
.register-btn {
    width: 100%;
    padding: 12px;
    background: #d0cccc;
    color: black;
    border: none;
    border-radius: 8px;
    margin-top: 10px;
    cursor: pointer;
}
/*Button foget*/
.forgot {
    margin-top: 8px;
    font-size: 14px;
}

.forgot a {
    text-decoration: none;
    color: #1f4fa3;
}

.forgot a:hover {
    text-decoration: underline;
}

/* Hover */
button:hover {
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="login-box">
    <img src="logo.png" class="logo">
    <h2>Đăng nhập</h2>

   <input type="text" id="username" placeholder="Tên đăng nhập">
    <input type="password" id="password" placeholder="Mật khẩu">

    <button class="login-btn" onclick="login()">Đăng nhập</button>

    <button class="register-btn" onclick="window.location.href='Dangky.html'">Đăng ký</button>
    <p class="forgot">
    <a href="#">Quên mật khẩu?</a>
</p>
</div>
<script>
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "" || pass === "") {
        document.getElementById("error").innerText = "Vui lòng nhập đầy đủ!";
        return;
    }

    let savedUser = localStorage.getItem("user");
    let savedPass = localStorage.getItem("pass");

    if(user === savedUser && pass === savedPass) {
        // ✅ Lưu trạng thái đăng nhập
        localStorage.setItem("isLogin", "true");

        // 👉 CHUYỂN TRANG
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("error").innerText = "Sai tài khoản hoặc mật khẩu!";
    }
}
</script>

</body>
</html>
