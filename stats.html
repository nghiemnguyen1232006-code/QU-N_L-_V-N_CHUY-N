<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Segoe UI;padding:20px;background:#f4f6f9}

h2{margin-bottom:20px}

/* CARD */
.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
margin-bottom:20px;
}

/* CANVAS */
canvas{
max-width:100%;
}
</style>
</head>

<body>

<h2>📊 Thống kê FASTGO</h2>

<div class="card">
<canvas id="chart"></canvas>
</div>

<script>

fetch("../api/stats.php")
.then(r=>r.json())
.then(d=>{

let ctx = document.getElementById("chart");

new Chart(ctx, {
type: 'bar',
data: {
labels: ['Đơn hàng', 'Tài xế', 'Kho'],
datasets: [{
label: 'Số lượng',
data: [d.orders, d.drivers, d.warehouse],
backgroundColor: [
'#1f4fa3',
'#28a745',
'#ffc107'
]
}]
},
options: {
responsive:true,
plugins:{
legend:{display:false}
}
}
});

});

</script>

</body>
</html>
