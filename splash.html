<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>FASTGO</title>

<style>
body {
    margin: 0;
    background: linear-gradient(to bottom, #d1d8e4, #1f4fa3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    font-family: Arial;
    color: white;
    opacity: 0;
    animation: fadeIn 1s forwards;
}

/* Logo */
.logo {
    width: 300px;
    transform: scale(0.7);
    animation: zoomIn 1.2s forwards;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.5));
}

/* Text */
h1 {
    margin-top: 15px;
    font-size: 28px;
    opacity: 0;
    animation: fadeText 1.5s forwards;
    animation-delay: 0.8s;
}

/* Loading spinner */
.loader {
    margin-top: 30px;
    width: 40px;
    height: 40px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top: 4px solid white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

/* Animations */
@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes zoomIn {
    to { transform: scale(1); }
}

@keyframes fadeText {
    to { opacity: 1; }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>

<script>
// Sau 4 giây thì fade out rồi chuyển trang
setTimeout(function() {
    document.body.style.transition = "1s";
    document.body.style.opacity = 0;

    setTimeout(function() {
        window.location.href = "login.html";
    }, 1000);

}, 1500);
</script>

</head>

<body>

    <img src="logo.png" class="logo">
    <h1>FASTGO</h1>

    <div class="loader"></div>

</body>
</html>
