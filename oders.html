<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{font-family:Segoe UI;padding:20px}

input{padding:8px;margin:5px}

button{padding:6px 10px;margin:2px;cursor:pointer}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:10px;
}

th{background:#1f4fa3;color:white;padding:10px}
td{padding:8px;text-align:center;border-bottom:1px solid #eee}
</style>
</head>

<body>

<h2>📦 Quản lý đơn hàng</h2>

<!-- ➕ THÊM -->
<input id="code" placeholder="Mã đơn">
<input id="product" placeholder="Tên hàng">
<button onclick="add()">➕ Thêm</button>

<table>
<thead>
<tr>
<th>ID</th>
<th>Mã</th>
<th>Tên hàng</th>
<th>Hành động</th>
</tr>
</thead>

<tbody id="data"></tbody>
</table>

<script>

function load(){
fetch("../api/oders.php")
.then(r=>r.json())
.then(data=>{
let html="";
data.forEach(o=>{
html+=`
<tr>
<td>${o.id}</td>
<td>${o.code}</td>
<td>
<input value="${o.product}" onchange="update(${o.id},this.value)">
</td>
<td>
<button onclick="del(${o.id})">❌</button>
</td>
</tr>`;
});
document.getElementById("data").innerHTML=html;
});
}

load();

/* ➕ ADD */
function add(){
let code = document.getElementById("code").value;
let product = document.getElementById("product").value;

let form = new FormData();
form.append("code",code);
form.append("product",product);

fetch("../api/oders.php",{method:"POST",body:form})
.then(()=>load());
}

/* ✏️ UPDATE */
function update(id,product){
fetch("../api/oders.php",{
method:"PUT",
body:"id="+id+"&product="+product
})
.then(()=>console.log("updated"));
}

/* ❌ DELETE */
function del(id){
fetch("../api/oders.php",{
method:"DELETE",
body:"id="+id
})
.then(()=>load());
}

</script>

</body>
</html>
